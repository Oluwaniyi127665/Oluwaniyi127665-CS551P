<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}UK Schools Explorer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1><a href="{{ url_for('main.home') }}">UK Schools Explorer</a></h1>
            <nav>
                <a href="{{ url_for('main.home') }}">Home</a>
                <a href="{{ url_for('main.schools_index') }}">Schools</a>
                <a href="{{ url_for('main.authorities_index') }}">Authorities</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
